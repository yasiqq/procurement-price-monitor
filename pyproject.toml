[project]
name = "procurement-price-monitor"
version = "0.1.0"
description = "ETL and API for monitoring procurement prices"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E - ошибки стиля (PEP 8), F - логические ошибки, I - сортировка импортов,
# UP - обновление синтаксиса под новые версии Python, B - поиск багов
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Игнорируем ошибку длины строки, так как line-length=100 уже задан

[tool.ruff.format]
quote-style = "double"
indent-style = "space"